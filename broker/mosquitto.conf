# Local RoadSense broker (run with ./run.sh from this folder).
# 1883 = plain MQTT for the ESP32, 9001 = WebSockets for the browser dashboard.
per_listener_settings false

listener 1883 0.0.0.0
protocol mqtt

listener 9001 0.0.0.0
protocol websockets

# Per-device credentials + topic ACL (STRIDE S and E). Created by setup.sh.
allow_anonymous false
password_file passwd
acl_file acl

persistence true
persistence_location data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
