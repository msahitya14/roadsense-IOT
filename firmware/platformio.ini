; RoadSense firmware: ESP32 + MPU-6050 only (no wheel encoder).
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev          ; change if your lab board differs (e.g. esp32-s3-devkitc-1)
framework = arduino
monitor_speed = 115200
monitor_eol = LF
monitor_filters = esp32_exception_decoder, send_on_enter
monitor_echo = yes
lib_deps =
    256dpi/MQTT@^2.5.2                        ; supports QoS 1 publish (PubSubClient from the labs is QoS 0 only)
    adafruit/Adafruit SSD1306@^2.5.13         ; same OLED libs as the labs
    adafruit/Adafruit GFX Library@^1.11.11
    h2zero/NimBLE-Arduino@^1.4.3              ; BLE link (much smaller than the built-in Bluedroid stack)
board_build.partitions = huge_app.csv         ; 3 MB app (no OTA), as in Lab 4: Wi-Fi + BLE together
build_flags =
    -DCORE_DEBUG_LEVEL=1
